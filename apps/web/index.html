<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d5c6b" />
    <!-- One title for both halves of this app (dashboard and public checkout). -->
    <title>FilsPay</title>
    <!-- IBM Plex Sans/Mono; system fonts are the fallback if this can't load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap"
    />
    <style>
      /* Both halves of the app draw their own page background. */
      body { margin: 0; background: var(--fp-bg, #0e1a22); }
    </style>
    <script>
      // Theme before first paint (no flash). "night" is the default; the
      // in-app switch stores "light" or "night" under fp-theme.
      (function () {
        var theme = "night";
        try {
          if (localStorage.getItem("fp-theme") === "light") theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
