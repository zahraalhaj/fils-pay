# FilsPay edge proxy: the only service that faces the internet.
#
#   /            → merchant dashboard + checkout (apps/web build)
#   /pay/*       → checkout (apps/web build)
#   /dashboard/* → merchant dashboard (apps/web build)
#   /admin/*     → ops console (apps/admin build, built with base /admin/)
#   /v1/*        → api:3000 (rate limited, overload answered with 429/503)
#   /healthz     → api liveness
#
# Settlement (:8091), reporting and Postgres are never routed from here.
# TLS is terminated in front of this proxy (the hosting platform's edge or
# certbot); it listens on 8080 inside the compose network.
# Included in nginx's http{} context (conf.d), so zones are declared here.

# --- overload protection ---------------------------------------------------
# Per client IP. Bursts absorb normal page loads; anything beyond is refused
# immediately with 429 instead of queueing until the API falls over.
limit_req_zone  $binary_remote_addr zone=api_per_ip:10m      rate=20r/s;
limit_req_zone  $binary_remote_addr zone=auth_per_ip:10m     rate=10r/m;
limit_req_zone  $binary_remote_addr zone=checkout_per_ip:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_status  429;
limit_conn_status 429;

upstream filspay_api {
    server api:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Real client address when the platform edge sits in front of us.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_conn conn_per_ip 50;
    client_max_body_size 10m;          # KYC uploads are capped at 8 MiB by the API
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Security headers on every response. Repeated inside any location that
    # sets its own add_header, because nginx would otherwise drop these.
    include /etc/nginx/snippets/filspay-headers.conf;

    # Overload and upstream failure: a fast, explicit answer clients can retry.
    error_page 429 = @too_many;
    error_page 502 503 504 = @unavailable;
    location @too_many {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"error":"rate_limited"}';
    }
    location @unavailable {
        default_type application/json;
        add_header Retry-After 5 always;
        return 503 '{"error":"service_unavailable"}';
    }

    location ~ /\. { deny all; }
    location /internal/ { return 404; }   # settlement's internal API is never public

    # --- API -----------------------------------------------------------------
    location /v1/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://filspay_api;
        include /etc/nginx/snippets/filspay-proxy.conf;
    }

    # Password and OTP guessing: a much tighter budget per IP.
    location ~ ^/v1/(admin/)?auth/ {
        limit_req zone=auth_per_ip burst=10 nodelay;
        proxy_pass http://filspay_api;
        include /etc/nginx/snippets/filspay-proxy.conf;
    }

    # Public, unauthenticated checkout API.
    location /v1/payment-links/ {
        limit_req zone=checkout_per_ip burst=20 nodelay;
        proxy_pass http://filspay_api;
        include /etc/nginx/snippets/filspay-proxy.conf;
    }

    # Streaming CSV export: no buffering, longer read timeout.
    location /v1/transactions/export {
        limit_req zone=api_per_ip burst=5 nodelay;
        proxy_pass http://filspay_api;
        include /etc/nginx/snippets/filspay-proxy.conf;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass http://filspay_api;
        include /etc/nginx/snippets/filspay-proxy.conf;
        access_log off;
    }

    # --- static apps ---------------------------------------------------------
    location /admin/assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/filspay-headers.conf;
    }
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/filspay-headers.conf;
    }

    location /assets/ {
        root /usr/share/nginx/html/web;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/filspay-headers.conf;
    }
    location / {
        root /usr/share/nginx/html/web;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/filspay-headers.conf;
    }
}
